el('market').innerHTML = D.market.map((x) => `<li>${esc(x)}</li>`).join('');
el('chips').innerHTML = [
  ...D.opportunities.map((x) => `<span class="chip up">Opportunity: ${x}</span>`),
  ...D.risks.map((x) => `<span class="chip down">Risk: ${x}</span>`)
].join('') || '<span class="chip">No ranked live setup</span>';
function rankedBrief(items, kind) {
  if (!items.length) return '<p class="muted">No qualifying same-day setups.</p>';
  return items.map((ticker) => {
    const x = D.stocks.find((s) => s.ticker === ticker);
    return `<p><b>${ticker}</b> — ${esc(kind === 'risk' ? x.risk : x.catalyst)}</p>`;
  }).join('');
}
el('opps').innerHTML = rankedBrief(D.opportunities, 'opportunity');
el('risks').innerHTML = rankedBrief(D.risks, 'risk');
function selected() {
  let items = [...D.stocks];
  if (filter === 'constructive') items = items.filter((x) => x.status === 'generated' && ['up','flat_to_up'].includes(x.horizons.today.direction));
  if (filter === 'risk') items = items.filter((x) => D.risks.includes(x.ticker));
  if (filter === 'stale') items = items.filter((x) => x.status !== 'generated');
  if (sortMode === 'confidence') items.sort((a,b) => (+b.horizons.today.confidence || 0) - (+a.horizons.today.confidence || 0));
  else if (sortMode === 'risk') items.sort((a,b) => D.risks.indexOf(a.ticker) - D.risks.indexOf(b.ticker));
  else items.sort((a,b) => a.ticker.localeCompare(b.ticker));
  return items;
}
function card(x) {
  const h = x.horizons.today;
  const status = x.status === 'generated' ? 'Fresh' : `${x.status.toUpperCase()} · ${x.note_date || 'no note'}`;
  const change = x.pct === 'n/a' ? 'n/a' : `${x.pct}%`;
  return `<article class="card"><h3>${x.ticker} <span class="meta">${esc(x.company)}</span></h3><div class="meta status-${x.status}">${status}</div><div class="line ${cls(h.direction)}">Today: ${esc(h.direction)} · ${esc(h.confidence)}/100 · ${esc(h.range)}</div><ul><li><b>Catalyst:</b> ${esc(x.catalyst)}</li><li><b>Signal:</b> ${esc(x.unusual)}</li><li><b>Risk:</b> ${esc(x.risk)}</li></ul><details><summary>Technical, horizons & calibration</summary><p>Ref ${fmt(x.reference)} · live/premarket ${fmt(x.live)} · ${change} vs ref</p><p>RSI ${esc(x.rsi)} · VEL5 ${esc(x.vel5)} · ${esc(x.gate)}</p><p>30D: ${esc(x.horizons['30d'].direction)} (${esc(x.horizons['30d'].range)})<br>90D: ${esc(x.horizons['90d'].direction)} (${esc(x.horizons['90d'].range)})<br>1Y: ${esc(x.horizons['1y'].direction)} (${esc(x.horizons['1y'].range)})</p><p><b>Thesis:</b> ${esc(h.thesis)}</p><p><b>Calibration:</b> ${esc(x.calibration)}</p></details></article>`;
}
function render() {
  const items = selected();
  el('cards').innerHTML = items.map(card).join('') || '<p class="muted">No tickers in this filter.</p>';
  el('rows').innerHTML = items.map((x) => `<tr><td><b>${x.ticker}</b></td><td class="status-${x.status}">${x.status}</td><td>${fmt(x.reference)} → ${fmt(x.live)}<br><span class="meta">${x.pct === 'n/a' ? 'n/a' : x.pct + '%'}</span></td><td class="${cls(x.horizons.today.direction)}">${esc(x.horizons.today.direction)} ${esc(x.horizons.today.confidence)}</td><td>${esc(x.horizons.today.range)}</td><td>${esc(x.rsi)}</td><td>${esc(x.vel5)}</td></tr>`).join('');
}
document.querySelectorAll('[data-filter]').forEach((button) => {
  button.onclick = () => { filter = button.dataset.filter; sortMode = filter === 'risk' ? 'risk' : 'ticker'; document.querySelectorAll('[data-filter]').forEach((b) => b.classList.toggle('active', b === button)); render(); };
});
el('sort').onclick = () => { sortMode = sortMode === 'ticker' ? 'confidence' : 'ticker'; el('sort').textContent = 'Sort: ' + sortMode; render(); };
render();
new Chart(el('confidence'), { type: 'bar', data: { labels: fresh.map((x) => x.ticker), datasets: [{ label: 'Today confidence', data: fresh.map((x) => +x.horizons.today.confidence || null), backgroundColor: fresh.map((x) => x.horizons.today.direction.includes('down') ? '#ff7185' : x.horizons.today.direction.includes('up') ? '#3bd49d' : '#ffca5b') }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } } });
new Chart(el('technical'), { type: 'scatter', data: { datasets: [{ label: 'Fresh tickers', data: fresh.filter((x) => typeof x.rsi === 'number' && typeof x.vel5 === 'number').map((x) => ({x:x.rsi, y:x.vel5, label:x.ticker})), backgroundColor: '#70b8ff' }] }, options: { plugins: { tooltip: { callbacks: { label: (c) => `${c.raw.label}: RSI ${c.raw.x}, VEL5 ${c.raw.y}` } } }, scales: { x: { title: { display: true, text: 'RSI' } }, y: { title: { display: true, text: 'VEL5' } } } } });
window.__miniappSummaryLoaded = true;
</script></body></html>
